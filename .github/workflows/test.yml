name: Runtime tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  elisp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs: ["29.1", "30.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - run: emacs -Q --batch -l test/run.el

