# The decode worker's environment; see the README for `uv sync`.  Each extra
# picks the PyTorch build for one kind of GPU.
[project]
name = "wime-worker"
version = "0"
license = "GPL-3.0-or-later"
requires-python = "==3.12.*"
dependencies = [
    "safetensors==0.8.0",
    "transformers==5.17.0",
]

[project.optional-dependencies]
cuda = ["torch==2.11.0"]
rocm = ["torch==2.11.0", "triton-rocm; sys_platform == 'linux'"]
xpu = ["torch==2.11.0", "triton-xpu; sys_platform == 'linux'"]
mps = ["torch==2.11.0; sys_platform == 'darwin'"]

[tool.uv]
package = false
conflicts = [[{ extra = "cuda" }, { extra = "rocm" }, { extra = "xpu" }, { extra = "mps" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cuda" },
    { index = "pytorch-rocm7.2", extra = "rocm" },
    { index = "pytorch-xpu", extra = "xpu" },
]
triton-rocm = { index = "pytorch-rocm7.2", extra = "rocm" }
triton-xpu = { index = "pytorch-xpu", extra = "xpu" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm7.2"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
